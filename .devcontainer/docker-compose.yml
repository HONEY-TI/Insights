services:
  insights:
    container_name: insights-devcontainer
    image: insights-devcontainer:latest
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile
      "args": { "USERNAME": "node", "WORKSPACE":"/workspace" }
    environment:
      NODE_OPTIONS: "--max-old-space-size=4096"
      GITHUB_TOKEN: ${GITHUB_TOKEN}      
      XAUTHORITY: /tmp/.xauth-devc
    env_file:
      - .env
    volumes:
      - ../:/workspace:cached
      - vscode-extensions-shared:/home/node/.vscode-server/extensions
    ports:
      - 3000:3000
      - 4200:4200
    cap_add:
      - NET_ADMIN
      - NET_RAW
      - SYS_ADMIN
    security_opt:
      - apparmor=unconfined
      - seccomp:unconfined
    command: sleep infinity
    networks:
      - insights-network
    deploy:
      resources:
        limits:
          memory: 6G
          cpus: "2"
        reservations:
          memory: 1G
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "1"

volumes:
  vscode-extensions-shared:
    external: true

networks:
  insights-network:
    external: true